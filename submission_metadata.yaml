# ============================================================
# Approach summary
# ============================================================
methodology_summary: |
  Multi-stage ranking pipeline v3.0 with 3 phases: (1) TF-IDF semantic
  matcher building and fast-filter of all 100K candidates to top 500 using
  cheap features; (2) deep analysis with full 9-dimensional scoring,
  negative signal detection, behavioral multiplier, and 20 honeypot checks;
  (3) final polish with S-curve NDCG@10 optimization and generative
  reasoning. Key innovations: TF-IDF replaces keyword counting (sublinear_tf
  reduces stuffer advantage), behavioral signals changed from additive to
  multiplicative (0.80x-1.15x) to prevent non-engineers from outranking real
  engineers, career progression trajectory scoring, skill-career coherence
  cross-referencing, company quality tiers, 20 honeypot checks including
  fictional company detection, keyword density anomaly, ghost score,
  temporal inversions. Weights optimized for NDCG: career_relevance=0.35,
  role_relevance=0.18, retrieval_ranking=0.11, production_ai=0.14, plus
  progression, coherence, company quality bonuses and negative signal
  penalties. Pipeline completes 100K candidates in ~79s (CPU-only).
  50 unit tests. 0 honeypots in top 100.

