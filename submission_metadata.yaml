  autocomplete. No candidate data was fed to any LLM.

# ============================================================
# Approach summary
# ============================================================
methodology_summary: |
  10-component rule-based ranker. Career history relevance (35%) is the
  primary signal; role relevance (20%) surfaces AI/ML titles; production AI
  evidence (14%) scores ML deployment experience; retrieval & ranking
  experience (10%) is a dedicated component for the JD's #1 ask;
  behavioral signals (10%) weights recruiter response rate, GitHub activity,
  and platform engagement; experience fit (5%), skills (3%), education (3%)
  with location (+3%) and notice period (+2%) bonuses. 8 honeypot detection
  checks: timeline inconsistency, overlapping education, AI skills without
  background, short descriptions, job-hopping, summary mismatch, career
  exceeds stated experience, endorsement mismatch. Scores use exponential
  normalization and min-heap Top-K selection. Runs 100K candidates in ~92s
  on CPU. 34 unit tests. 0 honeypots in top 100.

